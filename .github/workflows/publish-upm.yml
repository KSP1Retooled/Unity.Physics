name: Publish to UPM

# When a release is published, pack the Unity package with the native plug-in, sign it, attach the signed .tgz to the
# release, and add the release to the KSP1Retooled registry (https://ksp1retooled.github.io/upm/). To publish an
# existing release again, run this workflow by hand with its tag.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true

defaults:
  run:
    shell: bash

env:
  TAG: ${{ inputs.tag || github.event.release.tag_name }}

jobs:
  pack:
    name: Pack the package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      filename: ${{ steps.pack.outputs.filename }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false

      - uses: KSP1Retooled/upm/check-release@main
        with:
          tag: ${{ env.TAG }}
          source: |
            Native~/CMakeLists.txt
            Native~/src
          binaries: |
            Native~/Plugins/x86_64/RetooledPhysics.dll
            Native~/Plugins/x86_64/RetooledPhysics.so
            Native~/Plugins/x86_64/RetooledPhysics.dylib

      # Unity ignores Native~, so the plug-in moves to Plugins with the .meta files that preload it on each platform.
      - name: Put the plug-in where Unity loads it
        run: cp -R Native~/Plugins Native~/Plugins.meta .

      - id: pack
        uses: KSP1Retooled/upm/pack@main
        with:
          expect: |
            Plugins/x86_64/RetooledPhysics.dll
            Plugins/x86_64/RetooledPhysics.dll.meta
            Plugins/x86_64/RetooledPhysics.so
            Plugins/x86_64/RetooledPhysics.so.meta
            Plugins/x86_64/RetooledPhysics.dylib
            Plugins/x86_64/RetooledPhysics.dylib.meta

      - uses: actions/upload-artifact@v7
        with:
          name: package
          path: ${{ steps.pack.outputs.path }}
          retention-days: 1

  # Signing gets a job of its own, so the signing key never reaches a job that runs the package's own steps.
  sign:
    name: Sign the package
    needs: pack
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: package
          path: ${{ runner.temp }}/package

      - id: sign
        uses: KSP1Retooled/upm/sign@main
        with:
          tarball: ${{ runner.temp }}/package/${{ needs.pack.outputs.filename }}
          organization-id: ${{ vars.UPM_ORG_ID }}
          key-id: ${{ secrets.UPM_SERVICE_ACCOUNT_KEY_ID }}
          key: ${{ secrets.UPM_SERVICE_ACCOUNT_KEY }}

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNED: ${{ steps.sign.outputs.path }}
        run: gh release upload --repo "$GITHUB_REPOSITORY" -- "$TAG" "$SIGNED"

  publish:
    name: Publish to the registry
    needs: sign
    permissions:
      contents: read
    uses: KSP1Retooled/upm/.github/workflows/publish.yml@main
    with:
      tag: ${{ inputs.tag || github.event.release.tag_name }}
    secrets:
      APP_CLIENT_ID: ${{ secrets.APP_CLIENT_ID }}
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
